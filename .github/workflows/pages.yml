name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commitMessage = context.payload.head_commit?.message || `Deployment ${context.sha.slice(0, 7)}`;
            const [titleLine, ...descriptionLines] = commitMessage.split(/\\n|\r?\n/);
            const title = titleLine.trim() || 'Site update';
            const details = descriptionLines
              .map(line => line.replace(/^\s*[-*]\s+/, '').trim())
              .filter(Boolean);
            fs.writeFileSync('update.json', JSON.stringify({
              version: context.sha,
              title,
              notes: details
            }, null, 2));
            for (const file of ['index.html', 'Roter Admin.html']) {
              const html = fs.readFileSync(file, 'utf8');
              fs.writeFileSync(file, html.replace(
                '<meta name="app-build-version" content="development" />',
                `<meta name="app-build-version" content="${context.sha}" />`
              ));
            }
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

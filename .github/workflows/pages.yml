name: Publish static site from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commitMessage = context.payload.head_commit?.message || `Deployment ${context.sha.slice(0, 7)}`;
            const [titleLine, ...descriptionLines] = commitMessage.split(/\\n|\r?\n/);
            const title = titleLine.trim() || 'Site update';
            const details = descriptionLines
              .map(line => line.replace(/^\s*(?:[-*]|\d+\.)\s+/, '').trim())
              .filter(Boolean);
            const notes = details.filter(line =>
              !/^(?:co-authored-by|signed-off-by|reviewed-by|tested-by|change-id):/i.test(line)
            );
            const securityPattern = /\b(security\s+(?:fix|update|patch|improvement|hardening)|(?:fix|patch|harden)\w*\s+security|vulnerab\w*|firestore rules|two-factor|multi-factor|(?:require|enforce|restrict|gate|protect)\w*.{0,50}(?:verified users?|email verification|permission|access control|auth)|(?:verified users?|email verification).{0,50}(?:access|auth|permission))\b/i;
            const security = notes
              .filter(line => /^\[security\]\s*/i.test(line) ||
                (!/^\[feature\]\s*/i.test(line) && securityPattern.test(line)))
              .map(line => line.replace(/^\[security\]\s*/i, ''));
            const features = notes
              .filter(line => /^\[feature\]\s*/i.test(line) ||
                (!/^\[security\]\s*/i.test(line) && !securityPattern.test(line)))
              .map(line => line.replace(/^\[feature\]\s*/i, ''));
            if (!security.length) {
              security.push('Ongoing safeguard: verified-email checks gate update prompts and release notes.');
            }
            const html = fs.readFileSync('index.html', 'utf8');
            const versionTag = /<meta name="app-build-version" content="[^"]*" \/>/g;
            const matches = html.match(versionTag) || [];
            if (matches.length !== 1) {
              throw new Error(`Expected one app build version tag in index.html, found ${matches.length}.`);
            }
            fs.writeFileSync('index.html', html.replace(
              versionTag,
              `<meta name="app-build-version" content="${context.sha}" />`
            ));
            fs.writeFileSync('update.json', JSON.stringify({
              version: context.sha,
              versionLabel: `System version ${context.sha.slice(0, 7)}`,
              title,
              notes: notes.length ? notes : ['General improvements and fixes.'],
              features: features.length ? features : ['General improvements and maintenance.'],
              security,
              sizeBytes: fs.statSync('index.html').size
            }, null, 2));
      - name: Publish generated release files to GitHub Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html update.json
          if git diff --cached --quiet; then
            echo "Generated release files are already current."
          else
            git commit -m "Publish site release ${GITHUB_SHA:0:7}"
            git push origin HEAD:main
          fi
